<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, max-image-preview:none">
<meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex, max-image-preview:none">
<meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0D004C">
<title>Dr Shiv Hastawala, UK Awards</title>
<link rel="apple-touch-icon" href="logo.png">
<style>
  :root { --navy: #0D004C; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--navy); color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: 28px 18px 40px; }
  .card { width: 100%; height: auto; display: block; border-radius: 14px; border: 3px solid #fff; background: #fff;
    box-shadow: 0 10px 30px rgba(0,0,0,.35); }
  h1 { font-size: 20px; font-weight: 600; margin: 22px 0 4px; }
  .sub { margin: 0 0 20px; opacity: .8; font-size: 15px; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 54px;
    border-radius: 12px; font-size: 17px; font-weight: 600; text-decoration: none; margin: 0 0 12px; }
  .primary { background: #fff; color: var(--navy); }
  .secondary { background: transparent; color: #fff; border: 1.5px solid rgba(255,255,255,.7); }
  .row { display: flex; gap: 12px; }
  .row .btn { flex: 1; }
  .hint { font-size: 13px; opacity: .75; margin: -4px 0 16px; text-align: center; min-height: 1em; }
  svg { width: 20px; height: 20px; }
  footer { margin-top: 18px; text-align: center; font-size: 14px; opacity: .8; }
  footer a { color: #fff; }
</style>
</head>
<body>
<main>
  <img class="card" src="Dr-Shiv-Hastawala-UK-Awards-card.jpg" alt="Business card: Dr Shiv Hastawala, Consultant, UK Awards Ltd.">
  <h1>Dr Shiv Hastawala</h1>
  <p class="sub">Consultant, UK Awards Ltd.</p>

  <a class="btn primary" href="Shiv-Hastawala-UK-Awards.vcf">Save contact</a>
  <a class="btn primary" id="saveCard" href="Dr-Shiv-Hastawala-UK-Awards-card.jpg" download="Dr-Shiv-Hastawala-UK-Awards-card.jpg">Save card to Photos</a>
  <p class="hint" id="hint"></p>

  <div class="row">
    <a class="btn secondary" href="https://wa.me/447570489992">WhatsApp</a>
    <a class="btn secondary" href="mailto:shiv@ukawards.org.uk">Email</a>
  </div>

  <footer><a href="https://ukawards.org.uk">ukawards.org.uk</a></footer>
</main>
<script>
  // On iPhone and iPad, the share sheet offers "Save Image", which puts the card in Photos.
  // Elsewhere, the link simply downloads the card image.
  (function () {
    var ua = navigator.userAgent;
    var isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    var hint = document.getElementById("hint");
    var link = document.getElementById("saveCard");
    var file = null;
    if (isIOS && window.fetch && window.File) {
      fetch(link.getAttribute("href")).then(function (r) { return r.blob(); }).then(function (b) {
        file = new File([b], link.getAttribute("download"), { type: "image/jpeg" });
      }).catch(function () {});
    }
    hint.textContent = isIOS ? "Then tap Save Image" : "The card saves to your downloads";
    link.addEventListener("click", function (e) {
      if (isIOS && file && navigator.canShare && navigator.canShare({ files: [file] })) {
        e.preventDefault();
        navigator.share({ files: [file] }).catch(function () {});
      } else if (isIOS) {
        hint.textContent = "Press and hold the card above, then tap Save to Photos";
      }
    });
  })();
</script>
</body>
</html>
